<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;" />
  <title>eye-care break</title>
  <link rel="stylesheet" href="break.css" />
</head>
<body>
  <div id="bgLayer" class="bg-layer"></div>
  <div id="root">
    <div class="overlay">
      <div class="header">
        <div class="title" id="title">Time for an eye break</div>
        <div class="subtitle" id="subtitle">Follow the guided exercises below.</div>
      </div>
      <div class="progress-track"><div class="progress-fill" id="progress"></div></div>

      <div class="exercise">
        <div class="exercise-name" id="exerciseName"></div>

        <div class="guide-stage" id="guideStage">
          <svg class="guide-svg" id="guideSvg" viewBox="0 0 400 240" preserveAspectRatio="xMidYMid meet" aria-hidden="true"></svg>
        </div>

        <div class="step-text" id="stepText"></div>
        <div class="step-time" id="stepTime"></div>
      </div>

      <div class="source" id="source"></div>
      <div class="actions">
        <button id="skipBtn" class="btn-skip">Skip break</button>
      </div>
    </div>
  </div>
  <script src="break.js"></script>
</body>
</html>
